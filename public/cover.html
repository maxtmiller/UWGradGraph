<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:   #FFD54F;
    --cyan:   #00E5FF;
    --green:  #00E676;
    --pink:   #FF4081;
    --bg:     #070B14;
    --bg2:    #0A0F1E;
    --slate:  #0F172A;
  }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    color: #E2E8F0;
  }

  /* ── Animated grid ── */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: grid-drift 40s linear infinite;
  }
  @keyframes grid-drift {
    from { background-position: 0 0; }
    to   { background-position: 60px 60px; }
  }

  /* ── Radial glow blobs ── */
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(120px); opacity: 0.18;
    animation: pulse-blob 8s ease-in-out infinite alternate;
  }
  .blob-1 { width: 700px; height: 700px; background: var(--gold);
             top: -200px; left: -100px; animation-delay: 0s; }
  .blob-2 { width: 500px; height: 500px; background: var(--cyan);
             top: 400px; right: -80px; animation-delay: -3s; }
  .blob-3 { width: 400px; height: 400px; background: var(--green);
             bottom: -100px; left: 600px; animation-delay: -6s; }
  @keyframes pulse-blob {
    from { opacity: 0.12; transform: scale(1); }
    to   { opacity: 0.22; transform: scale(1.08); }
  }

  /* ── Floating node dots ── */
  .nodes-layer {
    position: absolute; inset: 0; pointer-events: none;
    overflow: hidden;
  }
  .node-dot {
    position: absolute;
    border-radius: 10px;
    background: rgba(15,23,42,0.85);
    border: 1.5px solid;
    display: flex; flex-direction: column;
    padding: 10px 14px; gap: 4px;
    animation: float-node linear infinite;
    opacity: 0;
  }
  .node-dot .nd-code { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; }
  .node-dot .nd-title { font-size: 9px; color: #475569; }
  .node-dot .nd-badge { font-size: 7px; border: 1px solid; border-radius: 3px;
                         padding: 1px 4px; width: fit-content; margin-top: 2px; }
  @keyframes float-node {
    0%   { opacity: 0; transform: translateY(0px) translateX(0px); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-80px) translateX(20px); }
  }

  /* ── Main layout ── */
  .stage {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
  }

  /* ── Left panel ── */
  .left {
    width: 780px; flex-shrink: 0;
    padding: 0 80px;
    display: flex; flex-direction: column;
    gap: 0;
    position: relative; z-index: 10;
  }

  .uw-badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,213,79,0.08);
    border: 1px solid rgba(255,213,79,0.25);
    border-radius: 40px;
    padding: 6px 16px 6px 10px;
    width: fit-content;
    margin-bottom: 36px;
    animation: fade-up 0.8s ease both;
  }
  .uw-badge-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #0A0F1E;
    font-family: 'Syne', sans-serif;
  }
  .uw-badge span { font-size: 11px; color: #94A3B8; letter-spacing: 0.08em; text-transform: uppercase; }

  .wordmark {
    font-family: 'Syne', sans-serif;
    font-size: 96px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -3px;
    margin-bottom: 32px;
    animation: fade-up 0.8s 0.1s ease both;
  }
  .wordmark .uw   { color: var(--gold); }
  .wordmark .grad { color: #E2E8F0; }
  .wordmark .graph{ color: var(--cyan); }

  .tagline {
    font-size: 22px;
    line-height: 1.45;
    color: #94A3B8;
    max-width: 540px;
    margin-bottom: 48px;
    animation: fade-up 0.8s 0.2s ease both;
  }
  .tagline strong { color: #CBD5E1; font-weight: 400; }

  .pills {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-bottom: 56px;
    animation: fade-up 0.8s 0.3s ease both;
  }
  .pill {
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    border: 1px solid;
  }
  .pill-gold  { color: var(--gold);  border-color: rgba(255,213,79,0.4);  background: rgba(255,213,79,0.08);  }
  .pill-cyan  { color: var(--cyan);  border-color: rgba(0,229,255,0.35);  background: rgba(0,229,255,0.07);   }
  .pill-green { color: var(--green); border-color: rgba(0,230,118,0.35); background: rgba(0,230,118,0.07);  }
  .pill-pink  { color: var(--pink);  border-color: rgba(255,64,129,0.35); background: rgba(255,64,129,0.07); }
  .pill-slate { color: #94A3B8;     border-color: rgba(148,163,184,0.2); background: rgba(148,163,184,0.05);}

  .meta {
    font-size: 10px; color: #334155; letter-spacing: 0.1em; text-transform: uppercase;
    animation: fade-up 0.8s 0.4s ease both;
  }

  /* ── Right panel — screenshot ── */
  .right {
    flex: 1;
    position: relative;
    height: 100%;
    display: flex; align-items: center; justify-content: flex-end;
  }

  .screenshot-wrap {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 1020px;
    animation: reveal-right 1s 0.15s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes reveal-right {
    from { opacity: 0; transform: translateY(-50%) translateX(60px); }
    to   { opacity: 1; transform: translateY(-50%) translateX(0); }
  }

  .screenshot-frame {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(0,229,255,0.15);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 120px rgba(0,229,255,0.06);
  }
  .screenshot-frame img {
    width: 100%; display: block;
    mask-image: linear-gradient(to right, transparent 0%, black 8%, black 88%, transparent 100%),
                linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
    mask-composite: intersect;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 88%, transparent 100%),
                        linear-gradient(to bottom, black 0%, black 85%, transparent 100%);
    -webkit-mask-composite: source-in;
  }

  /* ── Decorative line ── */
  .divider {
    position: absolute;
    top: 0; bottom: 0;
    left: 760px;
    width: 1px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(0,229,255,0.2) 30%,
      rgba(255,213,79,0.15) 60%,
      transparent 100%);
  }

  /* ── Corner decoration ── */
  .corner-tl, .corner-br {
    position: absolute;
    width: 80px; height: 80px;
    opacity: 0.4;
  }
  .corner-tl { top: 32px; left: 32px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .corner-br { bottom: 32px; right: 32px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  /* ── Slide number ── */
  .slide-num {
    position: absolute; bottom: 36px; left: 80px;
    font-size: 10px; color: #1E293B; letter-spacing: 0.12em;
    font-family: 'DM Mono', monospace;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

  el.style.cssText = `
    left: ${Math.random() * 700 + 50}px;
    bottom: ${Math.random() * 200 - 60}px;
    border-color: ${d.color}40;
    animation-duration: ${16 + Math.random()*12}s;
    animation-delay: ${Math.random()*-20}s;
  `;
  el.innerHTML = `
    <div class="nd-code" style="color:${d.color}">${d.code}</div>
    <div class="nd-title">${d.title}</div>
    <div class="nd-badge" style="color:${d.color};border-color:${d.color}60">${d.badge}</div>
  `;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 28000);
}

// Initial nodes
for(let i=0;i<6;i++) setTimeout(() => spawnNode(), i*2200);
setInterval(spawnNode, 2200);
</script>
</body>
</html>
